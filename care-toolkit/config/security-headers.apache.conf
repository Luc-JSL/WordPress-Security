# Security headers for Apache (mod_headers must be enabled: a2enmod headers).
# Put this in the site's VirtualHost or in .htaccess at the WordPress root.
# Test after deploying: forms, embedded videos and payment popups are the things
# a strict frame or CSP policy breaks first.

<IfModule mod_headers.c>
    # Tell browsers to use HTTPS for a year. Only enable once every subdomain works over HTTPS.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Stop browsers from guessing content types.
    Header always set X-Content-Type-Options "nosniff"

    # Only allow this site to frame itself (clickjacking protection).
    Header always set X-Frame-Options "SAMEORIGIN"

    # Send the origin, not the full URL, to other sites.
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Turn off browser features the site does not use.
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"

    # Content Security Policy in report-only mode first. Watch the browser console
    # for a month, add the sources plugins actually need, then switch to enforcing
    # by renaming the header to Content-Security-Policy.
    Header always set Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; frame-ancestors 'self'"
</IfModule>

# Block PHP execution inside the uploads folder. Place this block in
# wp-content/uploads/.htaccess instead of the root file.
# <FilesMatch "\.(php|phtml|php[0-9])$">
#     Require all denied
# </FilesMatch>

# Turn off directory listing.
Options -Indexes
