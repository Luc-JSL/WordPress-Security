# Security headers for nginx. Include inside the site's server { } block.
# Test after deploying: forms, embedded videos and payment popups are the things
# a strict frame or CSP policy breaks first.

# HTTPS for a year. Only enable once every subdomain works over HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Stop browsers from guessing content types.
add_header X-Content-Type-Options "nosniff" always;

# Only allow this site to frame itself.
add_header X-Frame-Options "SAMEORIGIN" always;

# Send the origin, not the full URL, to other sites.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Turn off browser features the site does not use.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Content Security Policy in report-only mode first; switch the header name to
# Content-Security-Policy once the console is quiet for a month.
add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; frame-ancestors 'self'" always;

# Block PHP execution inside the uploads folder.
location ~* /wp-content/uploads/.*\.php$ {
    deny all;
}

# Turn off directory listing (nginx default is off; this makes it explicit).
autoindex off;
